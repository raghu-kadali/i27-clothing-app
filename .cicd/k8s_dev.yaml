apiVersion: apps/v1
kind: Deployment
metadata:
  name: i27-clothing-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i27-clothing-dev
  template:
    metadata:
      labels:
        app: i27-clothing-dev
    spec:
      containers:
      - name: i27-clothing-dev
        image: DIT
        ports:
        - containerPort: 3000
        command: ["/entrypoint.sh"]
        args: ["dev"]
        env: 
        - name: ENVIRONMENT
          value: "dev"
---
apiVersion: v1
kind: Service
metadata:
  name: i27-clothing-dev-service
spec:
  selector:
    app: i27-clothing-dev
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30002
  type: NodePort
---                                        
apiVersion: networking.k8s.io/v1      
kind: Ingress
metadata:
  name: i27-clothing-ingress    
  namespace: cart-dev-ns
  annotations:
    kubernetes.io/ingress.class: "gce"    
spec:
  rules:
  - host: dev-clothing.raghuprojectdevops.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: i27-clothing-dev-service  
            port:
              number: 80
# this is writen if any domain we go routed toparticular dns only 
  - host: dev.raghuprojectdevops.in
  http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: i27-clothing-dev
            port:
              number: 80
